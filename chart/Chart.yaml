# apiVersion v2 on purpose. Helm 4 introduced chart format v3, but it is
# experimental and off unless the operator opts in; a v2 chart renders
# identically under Helm 3 and Helm 4, so it is the only format that works
# everywhere this chart might be installed from (CI, Argo CD, a laptop).
apiVersion: v2
name: arc-ui
description: Read-only dashboard for GitHub Actions Runner Controller (ARC)
type: application

# version  — the chart's own version, bumped on every template change.
# appVersion — the arc-ui release the default image tag points at.
version: 0.1.0
appVersion: "0.1.0"

keywords:
  - actions-runner-controller
  - arc
  - github-actions
  - dashboard
  - observability

home: https://github.com/WindKube/monorepo/tree/main/arc-ui
sources:
  - https://github.com/WindKube/monorepo/tree/main/arc-ui

maintainers:
  - name: SRE

annotations:
  # The dashboard never writes to the cluster; the shipped ClusterRole holds
  # get/list/watch and nothing else.
  category: Monitoring
