# v2, not Helm 4's experimental v3, so Helm 3 and Argo CD can render it.
apiVersion: v2
name: arc-ui
description: Read-only dashboard for GitHub Actions Runner Controller (ARC)
type: application

# version  — the chart's own version, bumped on every template change.
# appVersion — the arc-ui release the default image tag points at.
version: 0.2.0
appVersion: "0.1.0"

keywords:
  - actions-runner-controller
  - arc
  - github-actions
  - dashboard
  - observability

home: https://github.com/WindKube/actions-runner-controller-ui
sources:
  - https://github.com/WindKube/actions-runner-controller-ui

maintainers:
  - name: SRE

# Both off by default. Renovate bumps the pins; Chart.lock is committed and CI
# runs `helm dependency build`.
dependencies:
  - name: victoria-metrics-single
    version: 0.52.0
    repository: https://victoriametrics.github.io/helm-charts
    condition: victoria-metrics-single.enabled
  - name: alloy
    alias: collector
    version: 1.16.0
    repository: https://grafana.github.io/helm-charts
    condition: collector.enabled

annotations:
  # The dashboard never writes to the cluster; the shipped ClusterRole holds
  # get/list/watch and nothing else.
  category: Monitoring
