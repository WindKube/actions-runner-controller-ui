# arc-ui is read-only: it never writes to the cluster. A source it cannot
# reach shows as unavailable in the footer, never as zeros.

# -- Must stay 1: the app owns one SQLite file on one ReadWriteOnce volume.
replicaCount: 1

image:
  repository: ghcr.io/windkube/actions-runner-controller-ui
  # Overrides Chart.appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

command: []
args: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

commonLabels: {}
deploymentAnnotations: {}
podAnnotations: {}
podLabels: {}

revisionHistoryLimit: 3

# Every chart and usage figure is a PromQL query. Required.
prometheus:
  # Any server speaking the Prometheus HTTP API: Prometheus, Mimir, Thanos,
  # VictoriaMetrics. Include the path prefix, e.g. http://mimir/prometheus.
  url: ""
  # Sent on every query, e.g. {X-Scope-OrgID: team-a} for Mimir.
  headers: {}
  timeout: 10s
  insecureSkipVerify: false
  # The label holding the scale set name on gha_* listener series. The
  # listener exports it as "name".
  scaleSetLabel: name
  # The same on kube_pod_labels. kube-state-metrics only exports it when its
  # --metric-labels-allowlist includes pods=[actions.github.com/scale-set-name].
  ksmScaleSetLabel: label_actions_github_com_scale_set_name
  # Bearer token, basic auth password and CA file are secrets or files: set
  # ARC_UI_PROMETHEUS_BEARER_TOKEN, _USERNAME/_PASSWORD or _CA_FILE through
  # extraEnv with a secretKeyRef and extraVolumes.

# ARC_UI_* passthrough. null (or absent) drops the variable so the binary's
# default applies; "" is emitted as an empty value, which for
# ARC_UI_NAMESPACES means every namespace.
#
# Not settable here: ARC_UI_HTTP_ADDR, ARC_UI_PRESTOP_DELAY and
# ARC_UI_SHUTDOWN_TIMEOUT come from service.targetPort and gracePeriod.*, and
# ARC_UI_PROMETHEUS_* from prometheus.*.
env:
  ARC_UI_LOG_LEVEL: "info"
  ARC_UI_LOG_FORMAT: "json"

  # Runner namespaces; "" needs rbac.clusterWide.
  ARC_UI_NAMESPACES: "arc-runners"
  # Where the controller and the AutoscalingListeners live.
  ARC_UI_CONTROLLER_NAMESPACE: "arc-systems"

  ARC_UI_REFRESH_INTERVAL: "15s"

  # Must sit under persistence.mountPath.
  ARC_UI_DB_PATH: "/data/arc-ui.db"
  # Finished job rows; time series live in Prometheus.
  ARC_UI_JOB_RETENTION: "720h"

  ARC_UI_GITHUB_URL: "https://github.com"
  # ARC_UI_GITHUB_ORG: ""
  # Job pages link to Explore when set.
  # ARC_UI_GRAFANA_URL: ""
  # ARC_UI_GRAFANA_DATASOURCE: ""

  # In-app alert thresholds; the binary's defaults are shown.
  # ARC_UI_ALERT_QUEUED_AT_MAX_FOR: "15m"
  # ARC_UI_ALERT_LISTENER_DOWN_FOR: "2m"
  # ARC_UI_ALERT_OOM_WINDOW: "1h"
  # ARC_UI_ALERT_FAILED_RUNNERS_RISE: "3"
  # ARC_UI_ALERT_FAILED_RUNNERS_WINDOW: "15m"
  # ARC_UI_ALERT_STARTUP_P95: "2m"
  # ARC_UI_ALERT_STARTUP_WINDOW: "30m"

  ARC_UI_KUBE_QPS: "50"
  ARC_UI_KUBE_BURST: "100"

  # The DSN belongs in extraEnv with a secretKeyRef.
  ARC_UI_SENTRY_ENVIRONMENT: "production"
  ARC_UI_SENTRY_SAMPLE_RATE: "1.0"

extraEnv: []
envFrom: []

# terminationGracePeriodSeconds must cover preStopDelay + shutdownTimeout + 5s,
# or the kubelet kills the process mid-checkpoint; the chart refuses to render
# otherwise. preStopDelay must be at least twice the readiness period.
gracePeriod:
  preStopDelaySeconds: 10
  shutdownTimeoutSeconds: 20
terminationGracePeriodSeconds: 45

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  # Always would chown the whole volume on every start.
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

# Memory-backed /tmp for SQLite scratch files; counts against the memory limit.
tmpSizeLimit: 64Mi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

persistence:
  enabled: true
  existingClaim: ""
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  # "" uses the cluster default; "-" binds no class (a hand-made PV).
  storageClassName: ""
  mountPath: /data
  annotations: {}
  selector: {}

probes:
  startup:
    initialDelaySeconds: 3
    periodSeconds: 3
    timeoutSeconds: 2
    failureThreshold: 40
  liveness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6
  readiness:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

rbac:
  create: true
  # false binds the ClusterRole with RoleBindings into namespaces and
  # controllerNamespace only.
  clusterWide: true
  namespaces:
    - arc-runners
  controllerNamespace: arc-systems
  extraRules: []

ingress:
  enabled: false
  className: ""
  # nginx annotations that keep the SSE stream unbuffered.
  sseAnnotations: true
  annotations: {}
  hosts:
    - host: arc-ui.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Scrapes arc-ui's own /metrics.
serviceMonitor:
  enabled: false
  # Also skip when the monitoring.coreos.com CRD is absent. Set false under
  # GitOps: `helm template` sees no capabilities and would drop it silently.
  requireCapability: true
  namespace: ""
  labels: {}
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  relabelings: []
  metricRelabelings: []

# PodMonitors for ARC's own metrics, for a Prometheus Operator that does not
# scrape them yet. ARC ships metrics off: enable the metrics: block in the
# gha-runner-scale-set-controller values first, which gives the controller
# and every listener a container port named "metrics".
podMonitors:
  arc:
    enabled: false
    requireCapability: true
    # Where the PodMonitors are created, e.g. the namespace your Prometheus
    # selects monitors from. They always scrape rbac.controllerNamespace.
    namespace: ""
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
    controllerSelector:
      app.kubernetes.io/component: controller-manager
      app.kubernetes.io/part-of: gha-rs-controller
    listenerSelector:
      app.kubernetes.io/component: runner-scale-set-listener

# What the bundled store or collector scrapes. Namespaces come from
# env.ARC_UI_NAMESPACES and env.ARC_UI_CONTROLLER_NAMESPACE.
collection:
  interval: 30s
  # Kubelet serving certificates are rarely signed by the cluster CA.
  kubeletInsecureSkipVerify: true
  kubeStateMetrics:
    # The cluster's own kube-state-metrics, found by app.kubernetes.io/name and
    # port name. Ignored when kubeStateMetrics.enabled; the bundled one is
    # scraped instead.
    name: kube-state-metrics
    port: http
  # Where the collector sends samples. Empty means the bundled store.
  remoteWrite:
    url: ""
    headers: {}

# Bundled VictoriaMetrics, for clusters without a Prometheus. It scrapes the
# ARC listeners and controller, the kubelets' cAdvisor and kube-state-metrics,
# and prometheus.url defaults to it. The names below are what the parent wires
# to; change them together.
victoria-metrics-single:
  enabled: false
  rbac:
    # The parent grants only what the scrape needs; see scrape-rbac.yaml.
    create: false
  serviceAccount:
    create: true
    name: arc-ui-vm
  server:
    fullnameOverride: arc-ui-vm
    retentionPeriod: 30d
    extraArgs:
      # Picks up the scrape ConfigMap when the collector is toggled; the pod
      # is not restarted for a ConfigMap change.
      promscrape.configCheckInterval: 30s
    persistentVolume:
      enabled: true
      size: 16Gi
    scrape:
      enabled: true
      # Rendered by the parent from collection.*.
      configMap: arc-ui-vm-scrape

# Grafana Alloy as a scrape-and-remote_write collector, for clusters with a
# store but nothing scraping ARC into it. Its config is rendered by the parent
# into the ConfigMap named below.
collector:
  enabled: false
  fullnameOverride: arc-ui-collector
  crds:
    create: false
  rbac:
    create: false
  serviceAccount:
    create: true
    name: arc-ui-collector
  controller:
    type: deployment
    replicas: 1
  alloy:
    clustering:
      enabled: false
    configMap:
      create: false
      name: arc-ui-collector-config
      key: config.alloy

# kube-state-metrics for clusters that do not run one, cut down to the pod
# series and labels the app joins on. Clusters that already have it should add
# the metricLabelsAllowlist entry below to theirs instead.
kubeStateMetrics:
  enabled: false
  fullnameOverride: arc-ui-ksm
  # The alias would otherwise become the container name, which must be lowercase.
  nameOverride: kube-state-metrics
  # Must list the same namespaces as env.ARC_UI_NAMESPACES; the render fails
  # otherwise. Empty means every namespace and needs rbac.useClusterRole: true.
  namespaces: arc-runners
  rbac:
    useClusterRole: false
  collectors: [pods]
  metricAllowlist:
    - kube_pod_labels
    - kube_pod_container_resource_requests
    - kube_pod_container_resource_limits
  metricLabelsAllowlist:
    - pods=[actions-ephemeral-runner,actions.github.com/scale-set-name,actions.github.com/scale-set-namespace]
  service:
    port: 8080

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

extraVolumes: []
extraVolumeMounts: []
