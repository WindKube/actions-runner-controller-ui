# The parent wires the app URL, the scrape ConfigMaps and the RBAC subjects to
# names the subcharts render. A subchart upgrade that renames any of them
# fails here instead of leaving the app pointed at nothing.
suite: subchart names
set:
  victoria-metrics-single.enabled: true
  collector.enabled: true
  kubeStateMetrics.enabled: true
  collection.remoteWrite.url: http://mimir/api/v1/push
tests:
  - it: serves kube-state-metrics at arc-ui-ksm:8080
    template: charts/kubeStateMetrics/templates/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: arc-ui-ksm
      - equal:
          path: spec.ports[0].port
          value: 8080

  - it: runs kube-state-metrics on pods only, with the ARC labels
    template: charts/kubeStateMetrics/templates/deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].name
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
      - contains:
          path: spec.template.spec.containers[0].args
          content: --resources=pods
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metric-labels-allowlist=pods=[actions-ephemeral-runner,actions.github.com/scale-set-name,actions.github.com/scale-set-namespace]
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metric-allowlist=kube_pod_labels,kube_pod_container_resource_requests,kube_pod_container_resource_limits
      - contains:
          path: spec.template.spec.containers[0].args
          content: --namespaces=arc-runners

  - it: gives kube-state-metrics read-only pods in the runner namespace
    template: charts/kubeStateMetrics/templates/role.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: arc-runners
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [pods]
              verbs: [list, watch]


  - it: serves VictoriaMetrics at arc-ui-vm:8428
    template: charts/victoria-metrics-single/templates/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: arc-ui-vm
      - equal:
          path: spec.ports[0].port
          value: 8428

  - it: runs VictoriaMetrics as arc-ui-vm with the parent's scrape config
    template: charts/victoria-metrics-single/templates/server.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: arc-ui-vm
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config-out
            configMap:
              name: arc-ui-vm-scrape
      - contains:
          path: spec.template.spec.containers[0].args
          content: --retentionPeriod=30d
      - contains:
          path: spec.template.spec.containers[0].args
          content: --promscrape.configCheckInterval=30s

  - it: runs Alloy as one arc-ui-collector replica on the parent's config
    template: charts/collector/templates/controllers/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.serviceAccountName
          value: arc-ui-collector
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: arc-ui-collector-config
      - contains:
          path: spec.template.spec.containers[0].args
          content: /etc/alloy/config.alloy

  - it: leaves RBAC to the parent
    templates:
      - charts/victoria-metrics-single/templates/rbac.yaml
      - charts/collector/templates/rbac.yaml
    asserts:
      - hasDocuments:
          count: 0
