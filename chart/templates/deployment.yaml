{{- include "arc-ui.validate" . }}
# A Deployment with a Helm-owned PVC rather than a StatefulSet, so the volume
# can grow and uninstall can reason about it. Recreate, because RollingUpdate
# deadlocks on a ReadWriteOnce volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arc-ui.fullname" . }}
  labels:
    {{- include "arc-ui.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "arc-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "arc-ui.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "arc-ui.serviceAccountName" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: arc-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: ARC_UI_HTTP_ADDR
              value: "0.0.0.0:{{ .Values.service.targetPort }}"
            - name: ARC_UI_PRESTOP_DELAY
              value: "{{ .Values.gracePeriod.preStopDelaySeconds }}s"
            - name: ARC_UI_SHUTDOWN_TIMEOUT
              value: "{{ .Values.gracePeriod.shutdownTimeoutSeconds }}s"
            - name: ARC_UI_PROMETHEUS_URL
              value: {{ include "arc-ui.prometheusURL" . | quote }}
            {{- with .Values.prometheus.headers }}
            - name: ARC_UI_PROMETHEUS_HEADERS
              value: {{ include "arc-ui.headers" . | quote }}
            {{- end }}
            - name: ARC_UI_PROMETHEUS_TIMEOUT
              value: {{ .Values.prometheus.timeout | quote }}
            - name: ARC_UI_PROMETHEUS_INSECURE_SKIP_VERIFY
              value: {{ .Values.prometheus.insecureSkipVerify | quote }}
            - name: ARC_UI_PROMETHEUS_SCALE_SET_LABEL
              value: {{ .Values.prometheus.scaleSetLabel | quote }}
            - name: ARC_UI_PROMETHEUS_KSM_SCALE_SET_LABEL
              value: {{ .Values.prometheus.ksmScaleSetLabel | quote }}
            {{- range $name, $value := .Values.env }}
            {{- if not (kindIs "invalid" $value) }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Liveness stays on /livez: /readyz folds in the API server, and a
          # restart on an apiserver blip forces a full re-LIST at the worst time.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            # SQLite needs a writable /tmp under readOnlyRootFilesystem.
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "arc-ui.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tmpSizeLimit }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
