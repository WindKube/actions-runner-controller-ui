{{- include "arc-ui.validate" . }}
# A Deployment, not a StatefulSet, even though this pod owns a disk.
#
# A StatefulSet would carry the PVC in volumeClaimTemplates, and that has three
# problems here: the templates are immutable, so growing the disk means deleting
# and recreating the StatefulSet; the generated PVCs are invisible to Helm, so
# `helm uninstall` silently leaves them behind; and the stable network identity a
# StatefulSet exists to provide is worth nothing to a single replica behind a
# ClusterIP Service.
#
# The price is that a Deployment defaults to RollingUpdate, which DEADLOCKS on a
# ReadWriteOnce volume: the new pod cannot attach the volume while the old pod
# holds it, and the old pod is not removed until the new one is Ready. The rollout
# sits in ContainerCreating with "Multi-Attach error" until someone deletes the
# old pod by hand. `strategy: Recreate` below is what avoids it, and is why
# replicaCount is validated to be exactly 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arc-ui.fullname" . }}
  labels:
    {{- include "arc-ui.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "arc-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "arc-ui.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "arc-ui.serviceAccountName" . }}
      automountServiceAccountToken: true
      # See the arithmetic in the "arc-ui.validate" helper: this must outlast
      # preStopDelay + drain + store close, or the kubelet SIGKILLs the process
      # in the middle of a SQLite checkpoint.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: arc-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            # The listen address has to agree with containerPort, so it is derived
            # rather than exposed as yet another knob to get out of sync.
            - name: ARC_UI_HTTP_ADDR
              value: "0.0.0.0:{{ .Values.service.targetPort }}"
            # Single source of truth for the shutdown arithmetic: these two are
            # rendered from gracePeriod.*, which terminationGracePeriodSeconds is
            # validated against.
            - name: ARC_UI_PRESTOP_DELAY
              value: "{{ .Values.gracePeriod.preStopDelaySeconds }}s"
            - name: ARC_UI_SHUTDOWN_TIMEOUT
              value: "{{ .Values.gracePeriod.shutdownTimeoutSeconds }}s"
            {{- /*
            An entry set to null is dropped so the binary's own default applies.
            An entry set to "" is EMITTED as an empty value, which is not the same
            thing: ARC_UI_NAMESPACES="" is the documented way to say "every
            namespace", and caarlos0/env only falls back to envDefault when the
            variable is absent, not when it is present and empty.
            */}}
            {{- range $name, $value := .Values.env }}
            {{- if not (kindIs "invalid" $value) }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # /livez is process-local: it answers as long as the HTTP server is
          # alive, and knows nothing about the cluster connection.
          #
          # NEVER point liveness at /readyz. Readiness folds in the Kubernetes
          # informers and the API server reachability, so an apiserver blip or a
          # rolled RBAC would restart this pod — throwing away every warm informer
          # cache and forcing a full re-LIST of every runner the moment the API
          # server is already struggling. That makes recovery strictly slower and
          # can turn one blip into a CrashLoopBackOff.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            # failureThreshold * periodSeconds is the whole budget for opening the
            # SQLite file and migrating it; a large history file is not instant.
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          # /readyz reports informer sync and store reachability, so traffic is
          # held back until the dashboard would render real data instead of an
          # empty fleet.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            # readOnlyRootFilesystem leaves SQLite with nowhere to put its
            # temporary files (sorter spills, and the journal fallback when a
            # rollback cannot be done in memory). Without a writable /tmp the
            # first non-trivial query fails with SQLITE_CANTOPEN and the history
            # panels break in a way that looks like data loss.
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "arc-ui.pvcName" . }}
          {{- else }}
          # No PVC: history lives only as long as the pod. The dashboard still
          # works — every chart just starts empty after a restart.
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tmpSizeLimit }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
