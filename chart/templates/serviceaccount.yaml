{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "arc-ui.serviceAccountName" . }}
  labels:
    {{- include "arc-ui.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The pod needs the projected token to call the API server, so this stays true.
automountServiceAccountToken: true
{{- end }}
