{{- if .Values.collector.enabled }}
{{- $c := .Values.collection }}
{{- $ns := include "arc-ui.runnerNamespaceRegex" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.collector.alloy.configMap.name }}
  labels:
    {{- include "arc-ui.labels" . | nindent 4 }}
data:
  {{ .Values.collector.alloy.configMap.key }}: |
    discovery.kubernetes "arc" {
      role = "pod"
      namespaces {
        names = [{{ include "arc-ui.controllerNamespace" . | quote }}]
      }
    }

    discovery.relabel "arc" {
      targets = discovery.kubernetes.arc.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
        regex         = "controller-manager|runner-scale-set-listener"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_name"]
        regex         = "metrics"
        action        = "keep"
      }
      rule {
        action      = "labelmap"
        regex       = "__meta_kubernetes_pod_label_actions_github_com_(.+)"
        replacement = "actions_github_com_$1"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    }

    prometheus.scrape "arc" {
      job_name        = "arc"
      targets         = discovery.relabel.arc.output
      scrape_interval = {{ $c.interval | quote }}
      scrape_timeout  = {{ $c.interval | quote }}
      forward_to      = [prometheus.remote_write.default.receiver]
    }

    discovery.kubernetes "nodes" {
      role = "node"
    }

    prometheus.scrape "cadvisor" {
      job_name          = "kubelet-cadvisor"
      targets           = discovery.kubernetes.nodes.targets
      scheme            = "https"
      metrics_path      = "/metrics/cadvisor"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      scrape_interval   = {{ $c.interval | quote }}
      scrape_timeout    = {{ $c.interval | quote }}
      tls_config {
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = {{ $c.kubeletInsecureSkipVerify }}
      }
      forward_to = [prometheus.relabel.cadvisor.receiver]
    }

    prometheus.relabel "cadvisor" {
      forward_to = [prometheus.remote_write.default.receiver]
      rule {
        source_labels = ["__name__"]
        regex         = "container_cpu_usage_seconds_total|container_memory_working_set_bytes"
        action        = "keep"
      }
      rule {
        source_labels = ["namespace"]
        regex         = {{ $ns | quote }}
        action        = "keep"
      }
    }

    {{- $ksmTarget := include "arc-ui.ksmTarget" . }}
    {{- if not $ksmTarget }}
    discovery.kubernetes "ksm" {
      role = "pod"
    }

    discovery.relabel "ksm" {
      targets = discovery.kubernetes.ksm.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex         = {{ $c.kubeStateMetrics.name | regexQuoteMeta | quote }}
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_name"]
        regex         = {{ $c.kubeStateMetrics.port | regexQuoteMeta | quote }}
        action        = "keep"
      }
    }
    {{- end }}

    prometheus.scrape "ksm" {
      job_name        = "kube-state-metrics"
      {{- if $ksmTarget }}
      targets         = [{"__address__" = {{ $ksmTarget | quote }}}]
      {{- else }}
      targets         = discovery.relabel.ksm.output
      {{- end }}
      honor_labels    = true
      scrape_interval = {{ $c.interval | quote }}
      scrape_timeout  = {{ $c.interval | quote }}
      forward_to      = [prometheus.relabel.ksm.receiver]
    }

    prometheus.relabel "ksm" {
      forward_to = [prometheus.remote_write.default.receiver]
      rule {
        source_labels = ["__name__"]
        regex         = "kube_pod_labels|kube_pod_container_resource_requests|kube_pod_container_resource_limits"
        action        = "keep"
      }
      rule {
        source_labels = ["namespace"]
        regex         = {{ $ns | quote }}
        action        = "keep"
      }
    }

    prometheus.remote_write "default" {
      endpoint {
        url = {{ include "arc-ui.remoteWriteURL" . | quote }}
        {{- with $c.remoteWrite.headers }}
        headers = {
          {{- range $k := keys . | sortAlpha }}
          {{ $k | quote }} = {{ get $c.remoteWrite.headers $k | quote }},
          {{- end }}
        }
        {{- end }}
      }
    }
{{- end }}
