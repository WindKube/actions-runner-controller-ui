apiVersion: v1
kind: Service
metadata:
  name: {{ include "arc-ui.fullname" . }}
  labels:
    {{- include "arc-ui.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      # Named, because the ServiceMonitor selects the port by name — renaming it
      # silently stops scraping.
      name: http
  selector:
    {{- include "arc-ui.selectorLabels" . | nindent 4 }}
