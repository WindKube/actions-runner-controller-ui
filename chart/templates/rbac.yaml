{{- if .Values.rbac.create }}
# Read-only: get/list/watch on what the app reads and nothing else. Withheld on
# purpose: secrets (ARC's GitHub credentials), pods/exec|attach|portforward,
# pods/log, every write verb, and nodes and metrics.k8s.io, since usage comes
# from Prometheus.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "arc-ui.fullname" . }}
  labels:
    {{- include "arc-ui.labels" . | nindent 4 }}
rules:
  # A list or watch of the parent returns status too; /status is only needed
  # for writes.
  - apiGroups: ["actions.github.com"]
    resources:
      - autoscalingrunnersets
      - ephemeralrunnersets
      - ephemeralrunners
      - autoscalinglisteners
    verbs: ["get", "list", "watch"]
  # Runner and listener pods, and the events explaining a stuck runner.
  - apiGroups: [""]
    resources:
      - pods
      - events
    verbs: ["get", "list", "watch"]
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
{{- if .Values.rbac.clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "arc-ui.fullname" . }}
  labels:
    {{- include "arc-ui.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "arc-ui.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "arc-ui.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- $ns := concat (.Values.rbac.namespaces | default list) (list .Values.rbac.controllerNamespace) | compact | uniq }}
{{- if not $ns }}
{{- fail "arc-ui: rbac.clusterWide=false needs at least one of rbac.namespaces or rbac.controllerNamespace; with neither set, nothing would be granted and every panel would read as unavailable" }}
{{- end }}
{{- $root := . }}
{{- range $i, $namespace := $ns }}
{{- if $i }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "arc-ui.fullname" $root }}
  namespace: {{ $namespace }}
  labels:
    {{- include "arc-ui.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "arc-ui.fullname" $root }}
subjects:
  - kind: ServiceAccount
    name: {{ include "arc-ui.serviceAccountName" $root }}
    namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
