# go-test-coverage configuration, consumed by the test job in
# .github/workflows/ci.yml. Kept as a file rather than action inputs so that
# `go-test-coverage --config=.testcoverage.yml` reproduces CI's verdict locally.
profile: coverage.out

# Ratchet floors, not targets. They sit under today's numbers so that a
# regression trips them, and they are meant to be raised as real code lands.
#
# These apply to everything that does not have an `override:` entry below.
# Total is 66.1% today, comfortably clear of the 50 floor.
threshold:
  file: 50
  package: 50
  total: 50

exclude:
  paths:
    # templ and ent generated sources. Holding generated code to a coverage
    # floor measures the generator, not this project.
    - _templ\.go$
    - ^internal/store/ent/

# Per-path floors for the code that cannot meet the 50% default today.
#
# The floors above were first baselined against the scaffolding; the real
# application has since landed, and it left ten files and five packages under
# them. This block is that re-baseline, done per path rather than by lowering
# the defaults until everything goes green — a global floor of 20 would stop
# saying anything about the packages that are actually well covered.
#
# Two kinds of entry live here and they mean different things:
#
#   * A number just under today's coverage — a genuine ratchet for code that is
#     structurally hard to reach. A regression still trips it.
#   * A 0 — a package or file with no meaningful test coverage at all. That is a
#     TODO with a name attached, not a claim the code is untestable. When tests
#     land, delete the entry rather than nudging the number upward.
#
# go-test-coverage runs this one list against the file check and the package
# check alike, matching each path as an unanchored regex and taking the first
# hit. That is why `^cmd/arc-ui` covers the package and cmd/arc-ui/main.go in a
# single entry, while the file-only entries below are anchored with `$`.
override:
  # The composition root. main.go wires flags, config, the Kubernetes clients,
  # the store and the HTTP server together, and most of that is reachable only
  # with a live cluster and a real listener endpoint. It will never be much
  # higher than it is now.
  - path: ^cmd/arc-ui
    threshold: 20

  # --- packages with no test files yet -------------------------------------
  # Each of these deserves real tests rather than a permanent exemption.
  # internal/config used to be listed here and no longer is: it has tests now
  # and clears the 50% floor on its own. That is the intended lifecycle for
  # every entry in this section — delete it, do not nudge the number up.
  - path: ^internal/logging
    threshold: 0
  - path: ^internal/telemetry
    threshold: 0

  # internal/history has tests now, so it is a ratchet rather than an exemption:
  # set just under today's 29.3%. It stays listed because most of the package is
  # the mapping between the store's rows and the view's types, and the half that
  # is covered is the half with decisions in it — the stats cache and the
  # failure window. The rest goes up when the series mapping gets tests.
  - path: ^internal/history
    threshold: 25

  # --- single files inside packages that otherwise clear the floor ----------
  # clients.go builds real clientsets from a kubeconfig, so nothing short of a
  # test that talks to an API server covers it.
  - path: ^internal/k8s/clients\.go$
    threshold: 0
  # collector.go, model.go and types.go are large and partly covered; these are
  # ratchets set just under today's 39.6%, 37.3% and 29.2%.
  - path: ^internal/k8s/collector\.go$
    threshold: 35
  - path: ^internal/fleet/model\.go$
    threshold: 35
  - path: ^internal/arcapi/v1alpha1/types\.go$
    threshold: 25
  # The history panel's rendering. The queries behind it are covered in
  # internal/store; the templ-facing view code here is not.
  - path: ^internal/web/history\.go$
    threshold: 10
