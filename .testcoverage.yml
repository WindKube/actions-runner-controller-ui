# go-test-coverage configuration, consumed by the test job in
# .github/workflows/ci.yml. Kept as a file rather than action inputs so that
# `go-test-coverage --config=.testcoverage.yml` reproduces CI's verdict locally.
profile: coverage.out

# Ratchet floors, not targets. They sit just under today's numbers so that a
# regression trips them, and they are meant to be raised as real code lands.
#
# STALE — these were baselined against the scaffolding, and the real application
# has since landed. Measured now: total 66.1% (passes), but the file and package
# floors of 50 FAIL on ten files and five packages. cmd/arc-ui is 20.9% and will
# never be much more — main.go is the composition root, so most of it is only
# reachable with a live cluster and a real listener endpoint. internal/config,
# internal/history, internal/logging and internal/telemetry are at 0% because
# they have no test files yet.
#
# Re-baseline deliberately rather than by lowering these until they go green:
# decide per package whether the answer is tests or an `override:` entry.
threshold:
  file: 50
  package: 50
  total: 55

exclude:
  paths:
    # Pre-staged for the arc-ui import: templ and ent generated sources. Holding
    # generated code to a coverage floor measures the generator, not this project.
    - _templ\.go$
    - ^internal/store/ent/
