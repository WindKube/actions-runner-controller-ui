name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: golangci-lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: useblacksmith/setup-go@647ac649bd5b480f2a262e3e3e5f4d150ed452ad # v6.0.1
        with:
          go-version-file: go.mod
          cache: true

      # _templ.go is generated and gitignored, so a fresh checkout carries the
      # .templ sources but none of the Go they compile to. Every component the
      # package references — Document, OverviewPage, Tiles, ... — is undefined,
      # and golangci-lint surfaces that as a `typecheck` issue, which reads like
      # a linter fault rather than the missing generator it actually is.
      #
      # `go tool templ` runs the version pinned by go.mod's tool directive. It is
      # the same invocation the Dockerfile's generate stage uses, so CI and the
      # image can never generate with two different templ versions.
      #
      # Tailwind is deliberately NOT run here. internal/web/static/.gitkeep is
      # committed so that `go:embed all:static` compiles without app.css, and
      # neither the linters nor the tests read the stylesheet — downloading a
      # 100MB binary to produce CSS nothing asserts on would only cost minutes.
      - name: Generate templ sources
        run: go tool templ generate ./internal/web/...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          skip-cache: true

  test:
    name: unit tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: useblacksmith/setup-go@647ac649bd5b480f2a262e3e3e5f4d150ed452ad # v6.0.1
        with:
          go-version-file: go.mod
          cache: true

      # Same reason as the lint job: without this the packages that import
      # internal/web fail to build and `go test` reports "[build failed]"
      # instead of running anything.
      - name: Generate templ sources
        run: go tool templ generate ./internal/web/...

      - name: Unit tests
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

      - name: Check coverage thresholds
        id: coverage
        uses: vladopajic/go-test-coverage@f94bcf0d6b9fa5fb8b783830b22648f6c17475e2 # v2.19.0
        with:
          config: ./.testcoverage.yml

      - name: Publish coverage to the run summary
        if: always() && steps.coverage.outputs.report != ''
        env:
          REPORT: ${{ fromJSON(steps.coverage.outputs.report) }}
        run: |
          set -euo pipefail
          {
            echo '### Coverage'
            echo
            echo "$REPORT"
          } >> "$GITHUB_STEP_SUMMARY"

  chart:
    name: helm chart
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned like every other tool in this repo. setup-helm's default already
      # tracks Helm 4, but naming the version stops a future default from
      # silently changing what a passing chart test means — and --verify=false
      # below is a Helm 4 flag that does not exist in Helm 3, so the two have to
      # move together.
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      # Pinned rather than latest: an unpinned plugin can change what a passing
      # chart test means between two runs of the same commit.
      #
      # --verify=false is load-bearing under the Helm 4 pinned above. Helm 4
      # verifies plugin signatures before installing, but that check is only
      # defined for tarball sources (a .tgz with a sibling .prov). A VCS URL
      # like this one has no provenance file to check, so helm refuses up front
      # — "plugin source does not support verification" — rather than falling
      # back to an unverified install.
      #
      # This gives up nothing that was previously checked: a git+tag source has
      # never been signature-verified. The --version pin above, not this flag,
      # is what fixes which bytes get installed.
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.1.2 --verify=false

      - name: Lint the chart
        run: helm lint chart/

      # `helm lint` only proves the chart renders. These assert what it renders,
      # and — for the guard rails in the arc-ui.validate helper — that the render
      # refuses. A `fail` that quietly stopped firing is exactly the kind of
      # regression that otherwise surfaces in a cluster rather than in CI.
      - name: Run the chart unit tests
        run: helm unittest chart/

  container:
    name: container build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: blacksmith-4vcpu-ubuntu-2404
          - arch: arm64
            platform: linux/arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@a5256a73e30f09e37e3eceb8ca36043d17621d24 # v2.1.0
        with:
          cache-key: arc-ui-pr-${{ matrix.arch }}

      - name: Build the image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: arc-ui:pr
          build-args: |
            VERSION=0.0.0-pr

      - name: Smoke test the image
        run: |
          set -euo pipefail

          # Asserts the value rather than just printing it. This is the only
          # guard on the whole -ldflags chain — build-arg to ARG VERSION to
          # -X main.version to web.Builder.Version to the footer. Break any
          # link and the image still builds and still runs; it just silently
          # ships a UI that reads "arc-ui dev".
          got="$(docker run --rm arc-ui:pr version)"
          if [[ "$got" != "0.0.0-pr" ]]; then
            echo "::error::version stamping is broken: expected '0.0.0-pr', got '${got}'"
            exit 1
          fi
          echo "version stamped correctly: ${got}"
