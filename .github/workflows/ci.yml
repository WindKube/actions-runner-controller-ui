name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: golangci-lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: useblacksmith/setup-go@647ac649bd5b480f2a262e3e3e5f4d150ed452ad # v6.0.1
        with:
          go-version-file: go.mod
          cache: true

      # *_templ.go is gitignored; without it every component is an undefined
      # symbol that golangci-lint reports as a typecheck error.
      - name: Generate templ sources
        run: go tool templ generate ./internal/web/...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          skip-cache: true

  test:
    name: unit tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: useblacksmith/setup-go@647ac649bd5b480f2a262e3e3e5f4d150ed452ad # v6.0.1
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate templ sources
        run: go tool templ generate ./internal/web/...

      - name: Unit tests
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

      - name: Check coverage thresholds
        id: coverage
        uses: vladopajic/go-test-coverage@6890500b00a7e5862e54662c04ea9fa7c799ce1e # v2.23.0
        with:
          config: ./.testcoverage.yml

      - name: Publish coverage to the run summary
        if: always() && steps.coverage.outputs.report != ''
        env:
          REPORT: ${{ fromJSON(steps.coverage.outputs.report) }}
        run: |
          set -euo pipefail
          {
            echo '### Coverage'
            echo
            echo "$REPORT"
          } >> "$GITHUB_STEP_SUMMARY"

  arc-compat:
    name: arc-compat
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: useblacksmith/setup-go@647ac649bd5b480f2a262e3e3e5f4d150ed452ad # v6.0.1
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Check the vendored types against the pinned ARC release
        run: |
          set -euo pipefail
          version="$(cat internal/arcapi/v1alpha1/arc-version)"
          echo "ARC ${version}"
          helm pull oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller \
            --version "${version}" --untar --untardir "${RUNNER_TEMP}/arc"
          ARC_CRD_DIR="${RUNNER_TEMP}/arc/gha-runner-scale-set-controller/crds" \
            go test -count=1 -v ./internal/arcapi/...

  chart:
    name: helm chart
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --verify=false below is a Helm 4 flag, so the two move together.
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.2.4

      # Pinned to the commit tag v1.1.2 resolves to, because tags are mutable;
      # move it together with HELM_UNITTEST_REV in Taskfile.yaml. Helm 4 can only
      # verify .tgz sources, so a VCS install needs --verify=false.
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 33c48cac798e465deda9a66c8e6c07c0973cf53d --verify=false

      - name: Fetch the pinned subcharts
        run: |
          helm repo add vm https://victoriametrics.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm dependency build chart/

      - name: Lint the chart
        run: helm lint --strict chart/ --set prometheus.url=http://prometheus:9090

      - name: Run the chart unit tests
        run: helm unittest chart/

  e2e:
    name: kind e2e
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Create the kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: kind

      - name: Install ARC and arc-ui, then probe them
        run: test/e2e/run.sh

  container:
    name: container build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: blacksmith-4vcpu-ubuntu-2404
          - arch: arm64
            platform: linux/arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@06dd9c83a5d541274d2e3ac67625560979275267 # v2.3.0
        with:
          cache-key: arc-ui-pr-${{ matrix.arch }}

      - name: Build the image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: arc-ui:pr
          build-args: |
            VERSION=0.0.0-pr

      # The only guard on the -ldflags chain from build-arg to the UI footer.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          got="$(docker run --rm arc-ui:pr version)"
          if [[ "$got" != "0.0.0-pr" ]]; then
            echo "::error::version stamping is broken: expected '0.0.0-pr', got '${got}'"
            exit 1
          fi
          echo "version stamped correctly: ${got}"
