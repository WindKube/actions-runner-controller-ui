name: release-drafter

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-drafter
  cancel-in-progress: true

permissions: {}

jobs:
  draft:
    name: Update release draft
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Draft the next release
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
