version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unused

  settings:
    revive:
      rules:
        - name: var-naming
        - name: package-comments
        - name: unused-parameter
          disabled: true
    gocritic:
      disabled-checks:
        - ifElseChain
    misspell:
      ignore-rules:
        - arc-ui
        - runnerset
        - Runnerset

  exclusions:
    rules:
      # contextcheck follows calls into templ's generated components and asks
      # why they do not take a context. They cannot: a templ component is a
      # constructor returning templ.Component, and the context arrives later at
      # Render(ctx, w) — which internal/web does pass correctly. Every finding
      # here is the linter walking into generated code from its call site.
      - path: internal/web/
        linters:
          - contextcheck

      # Test files legitimately ignore Close errors on responses they are about
      # to discard, and build URLs from a test server's address.
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - gosec

      # Generated code. templ emits long, deliberately un-idiomatic functions and
      # ent emits thousands of lines of builders; linting either produces noise
      # nobody can act on, because the fix would be to edit the generator.
      - path: _templ\.go
        linters:
          - revive
          - gocritic
          - unused
          - ineffassign
          - prealloc
          - errcheck
          - gosec
      - path: internal/store/ent/
        linters:
          - revive
          - gocritic
          - unused
          - prealloc
          - errcheck
          - gosec
          - staticcheck

formatters:
  enable:
    - gofmt
    - goimports
